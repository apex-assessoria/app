<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APEX Assessoria</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070605">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#070605;--fg:#F3EEE2;--mute:#A39C8B;--gold:#FCBE09;
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--fg);font-family:var(--display);
  padding:40px max(20px,env(safe-area-inset-left,0px));text-align:center;
  -webkit-font-smoothing:antialiased}
.mark{font-weight:900;letter-spacing:.14em;font-size:22px;color:var(--gold);margin:0 0 14px}
.mark span{color:var(--fg)}
p{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
  <div>
    <p class="mark">APEX<span>&nbsp;Assessoria</span></p>
    <p>Área restrita</p>
  </div>
</body>
</html>
